# Bob — Local AI Computer Agent Configuration

server:
  host: "0.0.0.0"
  port: 8781
  api_token: "" # Set a token for API authentication (e.g. via BOB_API_TOKEN)

llm:
  provider: "ollama" # "ollama" or "mock"
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5-coder:7b" # Recommended for M4 Pro (or qwen2.5-coder:14b, llama3.1:8b)
  temperature: 0.2
  timeout_seconds: 120

agent:
  max_steps: 20
  max_tool_calls: 20
  timeout_seconds: 300

security:
  require_approval_for_sensitive_tools: true
  allowed_commands:
    - pwd
    - ls
    - git status
    - git diff
    - git log
    - git branch
    - go test
    - go build
    - go vet
    - echo
    - cat
    - uname
    - whoami
    - date
    - which
    - grep
    - find
  approval_required_commands:
    - rm
    - mv
    - chmod
    - chown
    - sudo
    - launchctl
    - diskutil
    - brew install
    - npm install
    - pip install
    - kill
    - pkill
    - reboot
  blocked_commands:
    - "rm -rf /"
    - "rm -rf /*"
    - "mkfs"
    - "dd if=/dev/zero"
    - ":(){ :|:& };:"
    - "shutdown"
    - "halt"

filesystem:
  allowed_paths:
    - "~/Projects"
    - "~/Documents"
    - "~/Documents/Bob-AI"
    - "~/BobWorkspace"
  max_output_bytes: 1048576 # 1MB
  max_file_size_read: 5242880 # 5MB

tailscale:
  enabled: true
  hostname: "" # Optional Tailscale hostname override

storage:
  data_dir: "~/.bob"
  audit_log_path: "~/.bob/audit.jsonl"
  screenshots_dir: "~/.bob/screenshots"
